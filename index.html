<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Sepuluh Seru | Tamberia Education</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#BFE6FF;--card:#fff;--ink:#2B2A4C;--mut:#5b5a7e;--coral:#FF6B5B;--sun:#FFC93C;--mint:#2FBF94;--blue:#3D8BFF;--cell:#FFFBEF;--line:#C7D4F2;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1A33;--card:#27254A;--ink:#F4F1FF;--mut:#B9B5E0;--cell:#34316A;--line:#403d78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1A33;--card:#27254A;--ink:#F4F1FF;--mut:#B9B5E0;--cell:#34316A;--line:#403d78;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding:14px}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.1;margin:0 0 6px}
h1{font-size:2rem;font-weight:800}h2{font-size:1.5rem;font-weight:800}h3{font-size:1.15rem;font-weight:600}
.mut{color:var(--mut)}p{margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.src:focus-visible,.ct:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#snd,#back{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.lc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px;border-radius:18px;border:3px solid var(--ink);background:var(--card)}
.lc b{font:800 2rem "Baloo 2",sans-serif;color:#1B1A33;background:var(--sun);border-radius:12px;padding:0 14px;line-height:1.3}
.lc:nth-child(3n+2) b{background:var(--mint)}.lc:nth-child(3n) b{background:var(--coral)}
.lc span{font-weight:700;line-height:1.2}.lc small{color:var(--mut)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px;margin:12px 0}
.say{font:800 1.35rem/1.25 "Baloo 2",sans-serif;text-align:center;min-height:2.6em}
.frames{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 0}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px;background:var(--ink);border-radius:12px;width:min(100%,260px)}
.frame.sm{width:min(46%,150px)}
.cell{aspect-ratio:1;background:var(--cell);border-radius:6px;display:grid;place-items:center;font-size:clamp(20px,7vw,32px)}
.sm .cell{font-size:19px}
.ct{display:block;line-height:1;cursor:grab;user-select:none;touch-action:none}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.ghost{position:fixed;pointer-events:none;font-size:46px;transform:translate(-50%,-50%) scale(1.2);z-index:60}
.cnt{font:800 1.6rem "Baloo 2",sans-serif;text-align:center}
.tray{display:flex;align-items:center;justify-content:center;gap:12px;min-height:70px}
.src{font-size:46px;line-height:1;padding:6px 14px;border:3px dashed var(--ink);border-radius:18px;background:var(--cell);cursor:grab;touch-action:none;user-select:none}
.fb{min-height:2.2em;text-align:center;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.go{flex:1;min-width:130px;font:800 1.2rem "Baloo 2",sans-serif;padding:12px;border-radius:16px;border:3px solid var(--ink);background:var(--sun);color:#1B1A33}
.go.alt{background:var(--card);color:var(--ink)}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:8px}.bar div{height:100%;background:var(--mint);transition:width .4s}
.cf{position:fixed;top:-30px;font-size:28px;pointer-events:none;z-index:70;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
details{margin-top:8px}summary{cursor:pointer;font-weight:700}
input{font:inherit;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);flex:1;min-width:140px}
.lc.lock{opacity:.55}.lc.lock b{background:var(--line);color:var(--ink)}
.mg{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}.mg button{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:4px 10px;font-weight:700}
.rd{display:flex;align-items:center;gap:10px;margin:6px 0;font-weight:700}.rd input{flex:none;min-width:0;width:22px;height:22px;padding:0}
.lnk{background:none;border:none;color:var(--blue);font-weight:800;text-decoration:underline;padding:6px}
/* ===== tampilan ceria (Tamberia Education) ===== */
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding-bottom:24px}
.hills{position:fixed;left:0;bottom:0;width:100%;height:150px;z-index:0;pointer-events:none}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}
@media (min-width:900px){.deco{display:block}}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.logo{width:76px;height:76px;flex:none;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;overflow:hidden}
.logo img{width:92%;height:92%;object-fit:contain}
.tbh{width:84px;flex:none}
.ttl{flex:1 1 100%;text-align:center;order:3}
.ttl h1{font-size:clamp(1.9rem,8vw,2.8rem);margin:0;text-shadow:0 3px 0 #fff}
.rib{display:inline-block;margin:6px 0 0;padding:6px 28px;background:var(--sun);font:800 .95rem/1.25 "Baloo 2",sans-serif;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.skl{margin:4px 0 0;font-weight:800}
#snd{margin-left:auto;width:56px;height:56px;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);font-size:1.5rem;padding:0;background:#fff}
@media (min-width:760px){.ttl{flex:1 1 0;order:0;text-align:left}.hd{flex-wrap:nowrap}#snd{order:4}}
.card{box-shadow:0 6px 0 var(--ink)}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:14px 16px;margin:10px 0 14px}
.wh{font:800 1.6rem/1.1 "Baloo 2",sans-serif}
.who .go{flex:none;min-width:0;padding:8px 18px;font-size:1.05rem}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.grid{gap:16px 14px}
.lv{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:22px;border:3px solid #8E94CC;background:#E3EEFF;box-shadow:0 5px 0 #8E94CC;color:var(--ink);width:100%}
.lv.open{border-color:var(--ink);background:#fff;box-shadow:0 6px 0 var(--ink)}
.lv b{flex:none;width:62px;height:62px;display:grid;place-items:center;font:800 1.9rem "Baloo 2",sans-serif;border-radius:16px;background:#D0D9FF;color:#5b5a9e}
.lv.open b{background:var(--sun);color:var(--ink);border:3px solid var(--ink)}
.lv .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lv .lt span{font:800 1.05rem/1.15 "Baloo 2",sans-serif}
.lv .lt small{color:var(--mut);font-weight:700}
.lv .tag{align-self:flex-start;background:var(--mint);border-radius:999px;padding:0 10px;font-size:.8rem;font-weight:800;font-style:normal}
.lv .ic{flex:none;font-size:1.3rem;line-height:1;font-style:normal;white-space:nowrap;padding-right:30px}
.lv .st{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;background:#D0D9FF;font-style:normal}
.lv.open .st{background:var(--coral);color:#fff;width:40px;height:40px;font-size:1.1rem;top:6px;right:6px;border:3px solid var(--ink)}
.lv .now{position:absolute;top:-16px;right:52px;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 12px;font:800 .9rem "Baloo 2",sans-serif;transform:rotate(4deg)}
.more{display:block;margin:4px auto 0;padding:8px 20px;border:3px dashed var(--ink);border-radius:999px;background:rgba(255,255,255,.75);font:800 1rem "Baloo 2",sans-serif}
.foot{margin-top:auto;padding-top:26px;position:relative;z-index:2}
.fr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.tilt{width:130px;transform:rotate(-8deg);flex:none}
@media (max-width:560px){.tilt{display:none}.fr{justify-content:flex-end}}
.tbf{display:flex;align-items:flex-end;gap:6px}
.tbf .tm{width:104px;flex:none}
.bub{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;font-weight:800;line-height:1.2;max-width:210px;font-size:.95rem;box-shadow:0 3px 0 var(--ink);margin-bottom:48px}
.bub small{display:block;font-weight:700;color:var(--mut);margin-top:2px}
.brand{margin:6px 0 0;text-align:center;font-size:.8rem;font-weight:800;color:#fff;text-shadow:0 1px 0 #1f5f3a}
main:has(#lvl:not([hidden])) #foot{display:none}
.tbrow{display:flex;align-items:center;gap:8px}.tbrow .say{flex:1;margin:0}.tbp{width:92px;flex:none}
.wacard{background:#E9FBEF;border-color:#1f9d55;box-shadow:0 6px 0 #1f9d55}
.wacard ol{margin:6px 0 12px;padding-left:22px}.wacard li{margin-bottom:2px}
.wabtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#0b3d1e;font:800 1.1rem "Baloo 2",sans-serif;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;text-decoration:none;box-shadow:0 4px 0 var(--ink)}
.tm{display:block;width:100%;height:auto;overflow:visible}
.tm .bd{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) scale(1.015)}}
.tm .ey{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.tm .wv{transform-box:view-box;transform-origin:150px 118px;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
.tm.hore .bd{animation:jump .6s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-14px)}}
.tm .sp{transform-box:fill-box;transform-origin:center;animation:tw 1s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}
.tm.ups .bd{animation:sway 1.4s ease-in-out infinite}
@keyframes sway{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.tm .tr{animation:drip 1.6s ease-in infinite}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.tm.zzz .bd{animation:breath 3.4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.035,1.02)}}
.tm .zz{animation:zf 2.6s ease-in infinite}
@keyframes zf{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-18px);opacity:0}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== tema pink ungu, judul, latar padang ===== */
:root{--ink:#3B2A6B;--mut:#6C5B94;--bg:#F6D9F3;--line:#E4D4FA;--cell:#FFF8FD;--coral:#FF5C9E;--mint:#38C9A0;--ol:-3px -3px 0 #5B3CC4,0 -3px 0 #5B3CC4,3px -3px 0 #5B3CC4,-3px 0 0 #5B3CC4,3px 0 0 #5B3CC4,-3px 3px 0 #5B3CC4,0 3px 0 #5B3CC4,3px 3px 0 #5B3CC4}
body{background:linear-gradient(180deg,#FFC6E6 0%,#E6D3FF 46%,#CDE8FF 100%) fixed}

.bn{font:800 .95rem "Baloo 2",sans-serif;color:var(--ink);background:rgba(255,255,255,.75);padding:2px 12px;border-radius:999px}

#back.hm{width:52px;height:52px;padding:0;border-radius:50%;background:#4D7CFF;border:3px solid #fff;box-shadow:0 4px 0 #2B4FD0;display:grid;place-items:center}

/* ===== ronde, soal, dan panduan ===== */
.rinfo{text-align:center;margin:0 0 6px;font-weight:800}
.gwrap{margin:8px 0}
.gtog{display:block;margin:0 auto 6px;padding:4px 16px;border-radius:999px;border:2px solid #E0A020;background:#FFF1B8;font:800 .95rem "Baloo 2",sans-serif;color:var(--ink)}
.gbox{background:#FFFDF0;border:3px dashed #E0A020;border-radius:18px;padding:8px 12px}
.gs{margin:4px 0 6px;padding-left:20px;font-size:.92rem;line-height:1.35}.gs li{margin-bottom:2px}
.gv{text-align:center;overflow-x:auto;padding:4px 0;line-height:1.1}
.ob{display:inline-block;font-size:1.5rem;line-height:1.35}
.gi{position:relative;display:inline-block;margin:1px 2px}
.gn{display:none}
.gv .gi{animation:gp var(--c,6s) infinite var(--d,0s)}
@keyframes gp{0%,14%,100%{transform:scale(1)}5%{transform:scale(1.4)}}
.gv .gn{display:block;position:absolute;top:-8px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--coral);color:#fff;font:800 .65rem/16px sans-serif;text-align:center;font-style:normal;opacity:0;animation:gb var(--c,6s) infinite var(--d,0s)}
@keyframes gb{0%{opacity:0;transform:scale(0)}6%{opacity:1;transform:scale(1.3)}12%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes gt{0%{opacity:0}8%,90%{opacity:1}100%{opacity:0}}
@keyframes gc{0%{opacity:0;transform:scale(2)}8%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
.gx::after,.xd::after{content:"\2716";position:absolute;left:0;right:0;top:0;text-align:center;color:#E11D48;font-size:1.3rem;line-height:1.35}
.gv .gx::after{opacity:0;animation:gc var(--c,6s) infinite var(--d,0s)}
.xo{cursor:pointer}
.ring{display:inline-block;border:3px dashed var(--coral);border-radius:14px;padding:2px 6px;margin:2px}

.hp{stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--c,6s) infinite var(--d,0s)}

.ht{opacity:0;animation:gt var(--c,6s) infinite var(--d,0s)}

@keyframes tpl{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.nls,.trs{display:block;margin:0 auto;max-width:100%;height:auto}.nls{width:min(100%,430px)}.trs{width:150px}
